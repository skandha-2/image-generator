<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevOps CI/CD Pipeline</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #14181c;
    }

    .wrapper {
      width: 1100px;
      height: 700px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      padding: 24px 32px;
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 20px;
      color: #5a6069;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Center circle */
    .center-node {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #f5f8ff, #dde6ff);
      border: 2px solid #6478c9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .center-node-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .center-node-sub {
      font-size: 14px;
      color: #4a5260;
    }

    /* Animated circular ring (with moving arrows) */
    .ring-svg {
      position: absolute;
      width: 520px;
      height: 520px;
      z-index: 0;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .ring-circle {
      fill: none;
      stroke: #e0e4f0;
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke: #6478c9;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 24 18; /* dash + gap */
      stroke-dashoffset: 0;
      animation: ring-move 4s linear infinite;
    }

    @keyframes ring-move {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -300;
      }
    }

    /* Node (icon + label) */
    .node {
      position: absolute;
      width: 180px;
      text-align: center;
      transform-origin: center center;
    }

    .node-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .node-icon-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #eef3ff;
      border: 2px solid #b2c2f0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      animation: pulse 3s ease-in-out infinite;
    }

    .node-icon-circle img {
      max-width: 72px;
      max-height: 72px;
      display: block;
    }

    .node-label {
      font-size: 13px;
      font-weight: 700;
    }

    .node-desc {
      font-size: 11px;
      color: #616774;
      line-height: 1.3;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }
    }

    /* START pill under GitHub */
    .start-pill {
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      background: #16a34a;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Pulsing start dot on ring */
    .start-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6);
      z-index: 3;
      transform: translate(-50%, -50%);
      animation: startPulse 1.4s ease-out infinite;
    }

    @keyframes startPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6);
        transform: translate(-50%, -50%) scale(1);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(22, 163, 74, 0);
        transform: translate(-50%, -50%) scale(1.15);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0);
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="title">DevOps CI/CD Pipeline</div>
      <div class="subtitle">
        Visualizing GitHub Actions Workflow Steps (Start → clockwise)
      </div>
    </div>

    <div class="canvas" id="canvas">
      <!-- Center node -->
      <div class="center-node">
        <div class="center-node-title">GitHub Actions</div>
        <div class="center-node-sub">CI/CD Pipeline</div>
      </div>

      <!-- Animated ring with moving arrows -->
      <svg class="ring-svg" id="ring-svg" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6478c9"/>
            <stop offset="100%" stop-color="#59b6ff"/>
          </linearGradient>

          <!-- Arrowhead for the moving dashes on the ring -->
          <marker id="ringArrowHead"
                  markerWidth="8" markerHeight="8"
                  refX="6" refY="3.5"
                  orient="auto"
                  markerUnits="strokeWidth">
            <polygon points="0 0, 7 3.5, 0 7" fill="#6478c9" />
          </marker>
        </defs>

        <!-- Faint base circle -->
        <circle class="ring-circle" cx="100" cy="100" r="92"/>

        <!-- Animated dashed circle with arrowheads -->
        <circle class="ring-progress"
                cx="100" cy="100" r="92"
                style="stroke:url(#ringGrad);"
                marker-mid="url(#ringArrowHead)"/>
      </svg>
    </div>
  </div>

  <script>
    // Steps in order around the circle (clockwise)
    const steps = [
      { label: "GitHub",             desc: "Repo & trigger",        icon: "icons/github.png" },
      { label: "Maven / Unit Tests", desc: "Build (Java 21, WAR)",  icon: "icons/maven.png" },
      { label: "CodeQL",             desc: "Static analysis",       icon: "icons/codeql.png" },
      { label: "Nexus",              desc: "Artifact repository",   icon: "icons/nexus.png" },
      { label: "SonarQube",          desc: "Code quality &\nQuality Gate",  icon: "icons/sonarqube.png" },
      { label: "Docker",             desc: "Image build &\nsecurity scan",  icon: "icons/docker.png" },
      { label: "GH Packages",        desc: "Container registry",    icon: "icons/gh-packages.png" },
      { label: "Helm",               desc: "Chart packaging",       icon: "icons/helm.png" },
      { label: "FluxCD",             desc: "GitOps deploy",         icon: "icons/fluxcd.png" },
    ];

    // Per-icon fine-tuning: radial & angle adjustments
    const radialAdjust = {
      "GitHub":             -24,
      "Maven / Unit Tests": -14,
      "CodeQL":             -11,
      "Nexus":               0,
      "SonarQube":          18,
      "Docker":             25,
      "GH Packages":        10,
      "Helm":                0,
      "FluxCD":            -11,
    };

    const angleAdjustDeg = {
      "GitHub":             0,
      "Maven / Unit Tests": 0,
      "CodeQL":             0,
      "Nexus":              0,
      "SonarQube":          0,
      "Docker":             0,
      "GH Packages":        0,
      "Helm":               0,
      "FluxCD":             0,
    };

    window.addEventListener("load", () => {
      const canvas  = document.getElementById("canvas");
      const ringSvg = document.getElementById("ring-svg");

      const centerX = canvas.clientWidth  / 2;
      const centerY = canvas.clientHeight / 2;

      // Ring radius in pixels (viewBox 0..200, r=92)
      const ringRadius = (ringSvg.clientWidth * 92) / 200;
      const baseIconRadius = ringRadius;

      let githubAngleRad = -Math.PI / 2; // default top

      // 1) Place nodes
      steps.forEach((step, index) => {
        let angle = (2 * Math.PI * index) / steps.length - Math.PI / 2;
        const aDeg = angleAdjustDeg[step.label] || 0;
        angle += (aDeg * Math.PI) / 180;

        if (step.label === "GitHub") {
          githubAngleRad = angle;
        }

        const rOffset = radialAdjust[step.label] || 0;
        const localRadius = baseIconRadius + rOffset;

        const x = centerX + localRadius * Math.cos(angle);
        const y = centerY + localRadius * Math.sin(angle);

        const node = document.createElement("div");
        node.className = "node";
        node.style.left = x + "px";
        node.style.top  = y + "px";
        node.style.transform = "translate(-50%, -50%)";

        const inner = document.createElement("div");
        inner.className = "node-inner";

        const circle = document.createElement("div");
        circle.className = "node-icon-circle";

        const img = document.createElement("img");
        img.src = step.icon;
        img.alt = step.label;
        circle.appendChild(img);

        const label = document.createElement("div");
        label.className = "node-label";
        label.textContent = step.label;

        const desc = document.createElement("div");
        desc.className = "node-desc";
        desc.innerHTML = step.desc.replace(/\n/g, "<br>");

        inner.appendChild(circle);
        inner.appendChild(label);
        inner.appendChild(desc);

        // Add START pill under GitHub node
        if (step.label === "GitHub") {
          const startPill = document.createElement("div");
          startPill.className = "start-pill";
          startPill.textContent = "START";
          inner.appendChild(startPill);
        }

        node.appendChild(inner);
        canvas.appendChild(node);
      });

      // 2) Add pulsing start dot on ring at GitHub start angle
      const startDotRadius = ringRadius; // exactly on ring
      const startX = centerX + startDotRadius * Math.cos(githubAngleRad);
      const startY = centerY + startDotRadius * Math.sin(githubAngleRad);

      const startDot = document.createElement("div");
      startDot.className = "start-dot";
      startDot.style.left = `${startX}px`;
      startDot.style.top  = `${startY}px`;
      canvas.appendChild(startDot);
    });
  </script>
</body>
</html>
