name: Generate CI/CD GIF

on:
  push:
    branches: [ main ]
    paths:
      - devops_poster.py
      - icons/**
      - .github/workflows/ci-cd-gif.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Generate animated CI/CD GIF
        run: |
          python devops_poster.py

      - name: Commit and push GIF if changed
        run: |
          FILE="docs/ci_cd_pipeline.gif"

          if git diff --quiet -- "$FILE"; then
            echo "No changes to $FILE"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILE"
          git commit -m "chore: update CI/CD pipeline GIF"
          git push
