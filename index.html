<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevOps CI/CD Pipeline</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #14181c;
    }

    .wrapper {
      width: 1100px;
      height: 700px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      padding: 24px 32px;
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #5a6069;
    }

    .canvas {
      position: relative;
      width: 100%;
      height: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Center circle */
    .center-node {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #f5f8ff, #dde6ff);
      border: 2px solid #6478c9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .center-node-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .center-node-sub {
      font-size: 14px;
      color: #4a5260;
    }

    /* Animated circular ring (behind nodes) */
    .ring-svg {
      position: absolute;
      width: 520px;
      height: 520px;
      z-index: 0;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .ring-circle {
      fill: none;
      stroke: #e0e4f0;
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke: #6478c9;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 1500;
      stroke-dashoffset: 1500;
      animation: rotate-progress 10s linear infinite;
    }

    @keyframes rotate-progress {
      0% {
        stroke-dashoffset: 1500;
        transform: rotate(0deg);
      }
      100% {
        stroke-dashoffset: 0;
        transform: rotate(360deg);
      }
    }

    /* Node (icon + label) */
    .node {
      position: absolute;
      width: 180px;
      text-align: center;
      transform-origin: center center;
    }

    .node-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .node-icon-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #eef3ff;
      border: 2px solid #b2c2f0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      animation: pulse 3s ease-in-out infinite;
    }

    .node-icon-circle img {
      max-width: 72px;
      max-height: 72px;
      display: block;
    }

    .node-label {
      font-size: 13px;
      font-weight: 700;
    }

    .node-desc {
      font-size: 11px;
      color: #616774;
      line-height: 1.3;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="title">DevOps CI/CD Pipeline</div>
      <div class="subtitle">
        Automated build, test, and deployment workflow
      </div>
    </div>

    <div class="canvas" id="canvas">
      <!-- Center node -->
      <div class="center-node">
        <div class="center-node-title">GitHub Actions</div>
        <div class="center-node-sub">CI/CD Pipeline</div>
      </div>

      <!-- Animated ring (live arrow effect) -->
      <svg class="ring-svg" id="ring-svg" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6478c9"/>
            <stop offset="100%" stop-color="#59b6ff"/>
          </linearGradient>
        </defs>
        <circle class="ring-circle" cx="100" cy="100" r="92"/>
        <circle class="ring-progress" cx="100" cy="100" r="92"
                style="stroke:url(#ringGrad); transform-origin: 50% 50%;"/>
      </svg>
    </div>
  </div>

  <script>
    // Steps config: label, desc, icon file relative to this HTML
    const steps = [
      { label: "GitHub",         desc: "Repo & trigger",                 icon: "icons/github.png" },
      { label: "Maven",          desc: "Build (Java 21, WAR)",          icon: "icons/maven.png" },
      { label: "Tests / CodeQL", desc: "Unit tests &\nstatic analysis", icon: "icons/codeql.png" },
      { label: "Nexus",          desc: "Artifact repository",           icon: "icons/nexus.png" },
      { label: "SonarQube",      desc: "Code quality &\nQuality Gate",  icon: "icons/sonarqube.png" },
      { label: "Docker",         desc: "Image build &\nsecurity scan",  icon: "icons/docker.png" },
      { label: "GH Packages",    desc: "Container registry",            icon: "icons/gh-packages.png" },
      { label: "Helm",           desc: "Chart packaging",               icon: "icons/helm.png" },
      { label: "FluxCD",         desc: "GitOps deploy",                 icon: "icons/fluxcd.png" },
    ];

    window.addEventListener("load", () => {
      const canvas  = document.getElementById("canvas");
      const ringSvg = document.getElementById("ring-svg");

      const centerX = canvas.clientWidth  / 2;
      const centerY = canvas.clientHeight / 2;

      // --- exact radius of the animated ring in page pixels ---
      // ring-svg viewBox is 0..200 and circle r=92
      // scale factor = ringSvg.clientWidth / 200
      const ringRadius = (ringSvg.clientWidth * 92) / 200;

      // place icons exactly on the ring (slightly outside for visual balance)
      const iconRadius = ringRadius; // you can use ringRadius + 4 if you want slightly outside

      steps.forEach((step, index) => {
        // equal spacing, starting at top (GitHub)
        const angle = (2 * Math.PI * index) / steps.length - Math.PI / 2;
        const x = centerX + iconRadius * Math.cos(angle);
        const y = centerY + iconRadius * Math.sin(angle);

        const node = document.createElement("div");
        node.className = "node";
        node.style.left = x + "px";
        node.style.top  = y + "px";
        node.style.transform = "translate(-50%, -50%)";

        const inner = document.createElement("div");
        inner.className = "node-inner";

        const circle = document.createElement("div");
        circle.className = "node-icon-circle";

        const img = document.createElement("img");
        img.src = step.icon;
        img.alt = step.label;
        circle.appendChild(img);

        const label = document.createElement("div");
        label.className = "node-label";
        label.textContent = step.label;

        const desc = document.createElement("div");
        desc.className = "node-desc";
        desc.innerHTML = step.desc.replace(/\n/g, "<br>");

        inner.appendChild(circle);
        inner.appendChild(label);
        inner.appendChild(desc);
        node.appendChild(inner);

        canvas.appendChild(node);
      });
    });
  </script>
</body>
</html>
